        <header class="brand-header">
          <img src="../branding/epic-learn-logo.png" alt="Epic Learn Education">
          <div class="session">Week 5 · Day 1</div>
        </header>
        ` + s.html + `
        <div class="foot">
          <span class="org">Epic Learn Institute of Higher Education - Go Programming Master Course</span>
          <span>${idx + 1} / ${slides.length}</span>
        </div>
        <div class="bar"><span></span></div>`;
      root.appendChild(el);
    });

    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      [...root.children].forEach((el, idx) => {
        el.classList.toggle("on", idx === i);
        el.querySelector(".bar > span").style.width = ((i + 1) / slides.length * 100) + "%";
      });
      notesEl.textContent = "Note: " + slides[i].notes;
      location.hash = String(i + 1);
    }

    function parseHash() {
      const n = parseInt(location.hash.replace("#", ""), 10);
      show(Number.isFinite(n) ? n - 1 : 0);
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
      if (e.key === "n" || e.key === "N") { notesOn = !notesOn; notesEl.classList.toggle("on", notesOn); }
      if (e.key === "?" || e.key === "h") help.classList.toggle("on");
      if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
      if (e.key === "p" || e.key === "P") window.print();
    });

    document.getElementById("slides").addEventListener("click", (e) => {
      if (e.clientX > innerWidth * 0.6) show(i + 1);
      else if (e.clientX < innerWidth * 0.4) show(i - 1);
    });

    window.addEventListener("hashchange", parseHash);
    parseHash();
  </script>
</body>
</html>
