<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 16 · Day 1 — Go Programming Master Course · Epic Learn</title>
  <style>
    :root {
      --ink: #14202b;
      --muted: #4d5d6b;
      --paper: #f4efe6;
      --card: #fffdf9;
      --line: #d8cfc2;
      --teal: #0b6e68;
      --teal-dark: #084f4b;
      --rust: #c24e1d;
      --gold: #c9a227;
      --code: #10212c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0e181f;
      color: var(--ink);
      font-family: "Segoe UI", "Calibri", "Liberation Sans", system-ui, sans-serif;
    }
    .deck {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .slides {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .slide {
      display: none;
      position: absolute;
      inset: 0;
      padding: 96px 72px 88px;
      background:
        radial-gradient(900px 420px at 100% -10%, rgba(11, 110, 104, 0.10), transparent 55%),
        linear-gradient(180deg, var(--paper), #efe7d9);
    }
    .slide.on { display: flex; flex-direction: column; }
    .slide.title-slide {
      justify-content: flex-end;
      background:
        linear-gradient(180deg, rgba(8, 31, 36, 0.15), rgba(8, 31, 36, 0.55)),
        linear-gradient(135deg, #0b6e68 0%, #14202b 55%, #c24e1d 140%);
      color: #f7f1e6;
    }
    .kicker {
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--teal-dark);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .title-slide .kicker { color: #ead9a3; }
    h1 {
      font-size: 54px;
      line-height: 1.08;
      margin: 0 0 16px;
      letter-spacing: -0.03em;
      max-width: 16ch;
    }
    h2 {
      font-size: 40px;
      line-height: 1.15;
      margin: 0 0 28px;
      letter-spacing: -0.03em;
    }
    .lede {
      font-size: 26px;
      line-height: 1.35;
      color: var(--muted);
      max-width: 32em;
      margin: 0 0 28px;
    }
    .title-slide .lede { color: #e7ddd0; max-width: 22em; }
    .meta { font-size: 18px; color: #d7cbb8; margin-top: 28px; }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 28px;
      line-height: 1.35;
    }
    ul li {
      position: relative;
      padding: 10px 0 10px 36px;
    }
    ul li::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--teal);
      position: absolute;
      left: 0;
      top: 1.05em;
    }
    ul.small { font-size: 22px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 8px;
    }
    .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--teal-dark);
    }
    .card p, .card li { font-size: 20px; line-height: 1.4; margin: 0; color: var(--ink); }
    .card ul li { padding-left: 24px; font-size: 20px; }
    .card ul li::before { width: 8px; height: 8px; top: 0.85em; background: var(--rust); }
    pre {
      margin: 0;
      background: var(--code);
      color: #e8f2ef;
      border-radius: 16px;
      padding: 22px 26px;
      font-size: 20px;
      line-height: 1.45;
      overflow: auto;
      font-family: "Cascadia Code", "Consolas", "Liberation Mono", monospace;
    }
    .tag {
      display: inline-block;
      background: var(--teal);
      color: white;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    .demo .tag { background: var(--rust); }
    .split { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 36px; align-items: start; }
    .brand-header {
      position: absolute;
      top: 18px;
      left: 56px;
      right: 56px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }
    .brand-header img {
      height: 56px;
      width: auto;
      display: block;
      background: #fff;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .brand-header .session {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--teal-dark);
    }
    .title-slide .brand-header .session { color: #ead9a3; }
    .foot {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .foot .org {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-slide .foot {
      color: #d8cbb8;
      border-top-color: rgba(255,255,255,0.25);
    }
    .bar {
      height: 6px;
      background: #d5cdc0;
      position: absolute;
      left: 0; right: 0; bottom: 0;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--teal);
      width: 0%;
    }
    .notes {
      display: none;
      background: #10212c;
      color: #e8f2ef;
      padding: 12px 72px;
      font-size: 15px;
      line-height: 1.4;
      max-height: 28vh;
      overflow: auto;
    }
    .notes.on { display: block; }
    .help {
      display: none;
      position: absolute;
      right: 28px;
      top: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      z-index: 5;
    }
    .help.on { display: block; }
    strong { color: var(--teal-dark); }
    .title-slide strong { color: #fff; }
    .big { font-size: 34px; line-height: 1.35; max-width: 22em; margin: 0; }
    .center {
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .title-slide.center {
      justify-content: center;
    }
    .title-slide.center h1 {
      max-width: none;
      font-size: 88px;
    }
    @page { size: 13.333in 7.5in; margin: 0; }
    @media print {
      html, body, .deck, .slides {
        height: auto !important;
        overflow: visible !important;
        background: white !important;
      }
      .notes, .help, .bar, .brand-header, .foot { display: none !important; }
      .slide {
        display: flex !important;
        position: relative !important;
        inset: auto !important;
        height: 7.5in;
        width: 13.333in;
        padding: 78px 64px 48px;
        page-break-after: always;
        break-after: page;
        overflow: hidden;
      }
      .slide:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>

      {

        `,

      {
        html: `
          <div class="kicker">Rubric</div>
          <h2>Code review (weeks 8–16)</h2>
          <ol class="small">
            <li>Builds and <code>gofmt</code> is clean</li>

      {
        html: `
          <div class="kicker">Pass 1</div>
          <h2>Errors and logging</h2>
          <pre>// Prefer
if err != nil {
  slog.Error("list students", "err", err)
  c.JSON(500, gin.H{"error": "internal error"})
  return
}
// Avoid: panic, fmt.Println(password), empty catch</pre>

            <li>Wrap with <code>%w</code> at boundaries; <code>errors.Is</code> for known cases.</li>

        `,

      },
      {
        html: `
          <div class="kicker">Pass 2</div>
          <h2>Refactor: naming, dead code, JSON shape</h2>
          <ul class="small">
            <li>Delete unused handlers / commented dumps.</li>
            <li>One JSON error shape: <code>{"error":"..."}</code> everywhere.</li>
            <li>Rename vague <code>data</code>, <code>tmp</code>, <code>Handle</code>.</li>
            <li><code>gofmt</code> + <code>go vet</code> before you demo.</li>

      },
      {
        html: `
          <div class="kicker">Go design</div>
          <h2>Idioms first — SOLID only as a lens</h2>
          <ul class="small">
            <li><strong>Small interfaces</strong> — accept what you need (<code>io.Reader</code> style).</li>
            <li><strong>Composition via embedding</strong> — prefer over deep inheritance stories.</li>
            <li><strong>Accept interfaces, return structs</strong> — keep constructors concrete.</li>
            <li><strong>Package clarity</strong> — <code>handlers</code> / <code>repository</code> / <code>middleware</code>.</li>
            <li><strong>A little copying beats a little dependency</strong>.</li>
          </ul>
        `,
        notes: "Do not grade SOLID acronyms. Grade clarity."
      },
      {
        html: `
          <div class="kicker">Example</div>
          <h2>Accept interfaces, return structs</h2>
          <pre>type StudentStore interface {
  List(ctx context.Context) ([]models.Student, error)
}
func NewStudentHandler(store StudentStore) *StudentHandler
// constructor returns *StudentHandler (concrete)</pre>

            <li>Tests inject a fake; production injects <code>*StudentRepository</code>.</li>

      {

internal/handlers
internal/repository
internal/middleware
internal/models
internal/config · database · utils</pre>

  db:
    image: postgres:16

    build: ./backend

      {

      {
        html: `

          <h2>Demo + merged <code>main</code> + retrospective</h2>

            <li>Working path: auth → protected students → Postgres.</li>

        `,

      },
      {
        cls: "demo",
        html: `
          <div class="tag">Live demo</div>
          <div class="kicker">Instructor model</div>
          <h2>Show a 8-minute walkthrough once</h2>
          <pre># health → register → login → Bearer list
# open auth_middleware.go → student_repository.go
# go test ./...  (or CI green screenshot)</pre>
        `,
        notes: "Model the timing they must match."
      },
      {
        cls: "demo",
        html: `
          <div class="tag">Live demo</div>
          <div class="kicker">Refactor win</div>
          <h2>One inconsistent error → one shape</h2>
          <pre>Before: c.String(500, err.Error())
After:  c.JSON(500, gin.H{"error": "internal error"})
        + slog.Error(...)</pre>
        `,
        notes: "Tiny, visible, teachable."
      },
      {
        cls: "demo",
        html: `
          <div class="tag">Live lab</div>
          <div class="kicker">Self-review</div>
          <h2>Score yourself on the 8-point rubric</h2>
          <pre>docs/week-16-day-01/starter/review-lab/checklist.md
# Mark pass/fail; fix the red items before demo</pre>
        `,
        notes: "Silent 25 min then pair share."
      },
      {
        html: `
          <div class="kicker">Pitfalls</div>

          <ul class="small">
            <li>Demo depends on data that only exists on one laptop.</li>

        `,
        notes: "AI policy reminder."

      {
        html: `
          <div class="kicker">Lab · rest of class</div>
          <h2>Done when all of this is true</h2>
          <ul class="small">
            <li>Self-review checklist completed</li>

      },

      {
        html: `

        `,

      },
      {
        titleSlide: true,
        cls: "center",
        html: `
          <h1>Questions</h1>
          <p class="lede" style="text-align:center;margin-top:1rem">Then: self-review → refactor → rehearse → demo.</p>

    const root = document.getElementById("slides");
    const notesEl = document.getElementById("notes");
    const help = document.getElementById("help");
    let i = 0;
    let notesOn = false;

    slides.forEach((s, idx) => {
      const el = document.createElement("section");
      el.className = "slide" + (s.titleSlide ? " title-slide" : "") + (s.cls ? " " + s.cls : "");
      el.innerHTML = `
        <header class="brand-header">
          <img src="../branding/epic-learn-logo.png" alt="Epic Learn Education">
          <div class="session">Week 16 · Day 1</div>
        </header>
        ` + s.html + `
        <div class="foot">
          <span class="org">Epic Learn Institute of Higher Education - Go Programming Master Course</span>
          <span>${idx + 1} / ${slides.length}</span>
        </div>
        <div class="bar"><span></span></div>`;
      root.appendChild(el);
    });

    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      [...root.children].forEach((el, idx) => {
        el.classList.toggle("on", idx === i);
        el.querySelector(".bar > span").style.width = ((i + 1) / slides.length * 100) + "%";
      });
      notesEl.textContent = "Note: " + slides[i].notes;
      location.hash = String(i + 1);
    }

    function parseHash() {
      const n = parseInt(location.hash.replace("#", ""), 10);
      show(Number.isFinite(n) ? n - 1 : 0);
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
      if (e.key === "n" || e.key === "N") { notesOn = !notesOn; notesEl.classList.toggle("on", notesOn); }
      if (e.key === "?" || e.key === "h") help.classList.toggle("on");
      if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
      if (e.key === "p" || e.key === "P") window.print();
    });

    document.getElementById("slides").addEventListener("click", (e) => {
      if (e.clientX > innerWidth * 0.6) show(i + 1);
      else if (e.clientX < innerWidth * 0.4) show(i - 1);
    });

    window.addEventListener("hashchange", parseHash);
    parseHash();
  </script>
</body>
</html>
