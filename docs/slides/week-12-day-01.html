<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Week 12 · Day 1 — Go Programming Master Course · Epic Learn</title>
  <style>
    :root {
      --ink: #14202b;
      --muted: #4d5d6b;
      --paper: #f4efe6;
      --card: #fffdf9;
      --line: #d8cfc2;
      --teal: #0b6e68;
      --teal-dark: #084f4b;
      --rust: #c24e1d;
      --gold: #c9a227;
      --code: #10212c;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #0e181f;
      color: var(--ink);
      font-family: "Segoe UI", "Calibri", "Liberation Sans", system-ui, sans-serif;
    }
    .deck {
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    .slides {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .slide {
      display: none;
      position: absolute;
      inset: 0;
      padding: 96px 72px 88px;
      background:
        radial-gradient(900px 420px at 100% -10%, rgba(11, 110, 104, 0.10), transparent 55%),
        linear-gradient(180deg, var(--paper), #efe7d9);
    }
    .slide.on { display: flex; flex-direction: column; }
    .slide.title-slide {
      justify-content: flex-end;
      background:
        linear-gradient(180deg, rgba(8, 31, 36, 0.15), rgba(8, 31, 36, 0.55)),
        linear-gradient(135deg, #0b6e68 0%, #14202b 55%, #c24e1d 140%);
      color: #f7f1e6;
    }
    .kicker {
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--teal-dark);
      font-weight: 700;
      margin-bottom: 12px;
    }
    .title-slide .kicker { color: #ead9a3; }
    h1 {
      font-size: 54px;
      line-height: 1.08;
      margin: 0 0 16px;
      letter-spacing: -0.03em;
      max-width: 16ch;
    }
    h2 {
      font-size: 40px;
      line-height: 1.15;
      margin: 0 0 28px;
      letter-spacing: -0.03em;
    }
    .lede {
      font-size: 26px;
      line-height: 1.35;
      color: var(--muted);
      max-width: 32em;
      margin: 0 0 28px;
    }
    .title-slide .lede { color: #e7ddd0; max-width: 22em; }
    .meta { font-size: 18px; color: #d7cbb8; margin-top: 28px; }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 28px;
      line-height: 1.35;
    }
    ul li {
      position: relative;
      padding: 10px 0 10px 36px;
    }
    ul li::before {
      content: "";
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--teal);
      position: absolute;
      left: 0;
      top: 1.05em;
    }
    ul.small { font-size: 22px; }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 8px;
    }
    .grid.three { grid-template-columns: 1fr 1fr 1fr; }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 22px 24px;
    }
    .card h3 {
      margin: 0 0 8px;
      font-size: 22px;
      color: var(--teal-dark);
    }
    .card p, .card li { font-size: 20px; line-height: 1.4; margin: 0; color: var(--ink); }
    .card ul li { padding-left: 24px; font-size: 20px; }
    .card ul li::before { width: 8px; height: 8px; top: 0.85em; background: var(--rust); }
    pre {
      margin: 0;
      background: var(--code);
      color: #e8f2ef;
      border-radius: 16px;
      padding: 22px 26px;
      font-size: 20px;
      line-height: 1.45;
      overflow: auto;
      font-family: "Cascadia Code", "Consolas", "Liberation Mono", monospace;
    }
    .tag {
      display: inline-block;
      background: var(--teal);
      color: white;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    .demo .tag { background: var(--rust); }
    .split { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 36px; align-items: start; }
    .brand-header {
      position: absolute;
      top: 18px;
      left: 56px;
      right: 56px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2;
    }
    .brand-header img {
      height: 56px;
      width: auto;
      display: block;
      background: #fff;
      padding: 4px 8px;
      border-radius: 8px;
    }
    .brand-header .session {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--teal-dark);
    }
    .title-slide .brand-header .session { color: #ead9a3; }
    .foot {
      position: absolute;
      left: 56px;
      right: 56px;
      bottom: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
      border-top: 1px solid var(--line);
      padding-top: 10px;
    }
    .foot .org {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .title-slide .foot {
      color: #d8cbb8;
      border-top-color: rgba(255,255,255,0.25);
    }
    .bar {
      height: 6px;
      background: #d5cdc0;
      position: absolute;
      left: 0; right: 0; bottom: 0;
    }
    .bar > span {
      display: block;
      height: 100%;
      background: var(--teal);
      width: 0%;
    }
    .notes {
      display: none;
      background: #10212c;
      color: #e8f2ef;
      padding: 12px 72px;
      font-size: 15px;
      line-height: 1.4;
      max-height: 28vh;
      overflow: auto;
    }
    .notes.on { display: block; }
    .help {
      display: none;
      position: absolute;
      right: 28px;
      top: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 14px;
      z-index: 5;
    }
    .help.on { display: block; }
    strong { color: var(--teal-dark); }
    .title-slide strong { color: #fff; }
    .big { font-size: 34px; line-height: 1.35; max-width: 22em; margin: 0; }
    .center {
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .title-slide.center {
      justify-content: center;
    }
    .title-slide.center h1 {
      max-width: none;
      font-size: 88px;
    }
    @page { size: 13.333in 7.5in; margin: 0; }
    @media print {
      html, body, .deck, .slides {
        height: auto !important;
        overflow: visible !important;
        background: white !important;
      }
      .notes, .help, .bar, .brand-header, .foot { display: none !important; }
      .slide {
        display: flex !important;
        position: relative !important;
        inset: auto !important;
        height: 7.5in;
        width: 13.333in;
        padding: 78px 64px 48px;
        page-break-after: always;
        break-after: page;
        overflow: hidden;
      }
      .slide:last-child { page-break-after: auto; }
    }
  </style>
</head>
<body>
  <div class="deck">
    <div class="slides" id="slides"></div>
    <div class="notes" id="notes"></div>
  </div>
  <div class="help" id="help">
    ← → space · F fullscreen · N notes · P print/PDF · ? help
  </div>
  <script>
    const slides = [
      {
        titleSlide: true,
        html: `
          <div class="kicker">Go Programming Master Course</div>
          <h1>Week 12, Day 1</h1>
          <p class="lede">Mutex, WaitGroup, context, and races — make shared memory and cancellation safe.</p>
          <p class="meta">Umesh Indrajith · BSc Eng (Hons), University of Moratuwa<br>Senior Software Engineer / Lecturer</p>
        `,
        notes: "Week 11: worker pool. Today: lock the map for real, pass context, -race green, graceful shutdown sketch."
      },
      {
        html: `
          <div class="kicker">Since last week</div>
          <h2>You have a pool. Now protect shared state.</h2>
          <ul class="small">
            <li>Worker pool + WaitGroup join — keep that.</li>
            <li>Week 10 previewed <code>go test -race</code>; today we <strong>fix</strong> the red → green loop.</li>
            <li>Create still sync. Import still uses a pool. Map must stay locked.</li>
          </ul>
        `,
        notes: "Confirm pool mental model."
      },
      {
        html: `
          <div class="kicker">Today</div>
          <h2>If Day 1 of week 12 works, you can</h2>
          <ul class="small">
            <li>Protect a shared counter/map with <code>sync.Mutex</code> (and name <code>RWMutex</code>).</li>
            <li>Use WaitGroup as a join (not a lock).</li>
            <li>Pass <code>c.Request.Context()</code> into repository signatures.</li>
            <li>Demo a timeout with <code>context.WithTimeout</code>.</li>
            <li>Sketch graceful shutdown with <code>signal.Notify</code>.</li>
            <li>Get <code>go test -race</code> green on the lab.</li>
          </ul>
        `,
        notes: "Gate: race red → mutex → green."
      },
      {
        html: `
          <div class="kicker">Software engineering</div>
          <h2>Shared memory needs a rule</h2>
          <p class="lede">Channels coordinate work. Mutexes protect <em>data</em>. Context cancels <em>work</em>.</p>
          <ul class="small">
            <li>SMS: lock the in-memory map; add <code>context.Context</code> to repo methods (may ignore until week 14).</li>
            <li>Homework: README test command includes <code>-race</code>.</li>
          </ul>
        `,
        notes: "Three tools: channel / mutex / context."
      },
      {
        html: `
          <div class="kicker">Data race</div>
          <h2>Two goroutines · one variable · no sync</h2>
          <pre>var n int
go func() { n++ }()
go func() { n++ }()</pre>
          <ul class="small">
            <li>May “work” until it doesn’t — undefined behavior.</li>
            <li><code>go test -race</code> makes it visible (needs cgo + gcc).</li>
          </ul>
        `,
        notes: "Show week-10 unsafe counter again."
      },
      {
        html: `
          <div class="kicker">Mutex</div>
          <h2>One writer (or reader) at a time</h2>
          <pre>var mu sync.Mutex
mu.Lock()
n++
mu.Unlock()
// prefer: defer mu.Unlock() right after Lock</pre>
          <ul class="small">
            <li>Hold locks short. Don’t call slow I/O under lock.</li>
            <li>Same mutex for the same data — document ownership.</li>
          </ul>
        `,
        notes: "Live fix UnsafeAdd → SafeAdd."
      },
      {
        html: `
          <div class="kicker">RWMutex</div>
          <h2>Many readers · one writer</h2>
          <pre>var mu sync.RWMutex
mu.RLock(); defer mu.RUnlock()  // readers
mu.Lock();  defer mu.Unlock()   // writers</pre>
          <ul class="small">
            <li>Use when reads dominate and critical sections are tiny.</li>
            <li>SMS starter: <code>Mutex</code> is enough; mention RWMutex so the word sticks.</li>
          </ul>
        `,
        notes: "Optional depth — don’t force rewrite."
      },
      {
        html: `
          <div class="kicker">WaitGroup</div>
          <h2>Join, not lock</h2>
          <pre>var wg sync.WaitGroup
wg.Add(N)
go func() { defer wg.Done(); work() }()
wg.Wait() // all Done</pre>
          <ul class="small">
            <li>Does <strong>not</strong> protect <code>n++</code> — still need a mutex (or channels).</li>
            <li>Week 11: WaitGroup before closing results.</li>
          </ul>
        `,
        notes: "Quiz: WaitGroup vs Mutex."
      },
      {
        html: `
          <div class="kicker">context</div>
          <h2>Cancel · deadline · timeout</h2>
          <pre>ctx, cancel := context.WithTimeout(parent, 2*time.Second)
defer cancel()
select {
case &lt;-ctx.Done():
    return ctx.Err() // deadline exceeded / canceled
case result := &lt;-work:
    return result, nil
}</pre>
          <ul class="small">
            <li>Context flows down the call stack — first param by convention.</li>
            <li>Always <code>defer cancel()</code> when you create a derived context.</li>
          </ul>
        `,
        notes: "One timeout demo is enough."
      },
      {
        html: `
          <div class="kicker">Gin</div>
          <h2><code>c.Request.Context()</code> on every handler</h2>
          <pre>func (h *StudentHandler) GetByID(c *gin.Context) {
    ctx := c.Request.Context()
    s, err := h.repo.GetByID(ctx, id)
    ...
}</pre>
          <ul class="small">
            <li>Client disconnect / server shutdown cancels that context.</li>
            <li>Repo may ignore <code>ctx</code> until Postgres (week 14) — signature still changes now.</li>
          </ul>
        `,
        notes: "Spiral: signature first, use later."
      },
      {
        html: `
          <div class="kicker">SMS milestone</div>
          <h2>Lock the map · pass context</h2>
          <pre>func (r *StudentRepository) Create(ctx context.Context, in ...) Student {
    _ = ctx // ignored until DB
    r.mu.Lock()
    defer r.mu.Unlock()
    ...
}</pre>
          <ul class="small">
            <li>Handlers pass <code>c.Request.Context()</code>.</li>
            <li>Demo timeout endpoint: slow work respects deadline.</li>
          </ul>
        `,
        notes: "Repo already had mu — make ctx signatures the week-12 diff."
      },
      {
        html: `
          <div class="kicker">Graceful shutdown</div>
          <h2>Sketch — don’t leave listeners hanging</h2>
          <pre>ctx, stop := signal.NotifyContext(context.Background(), os.Interrupt, syscall.SIGTERM)
defer stop()
srv := &amp;http.Server{Addr: addr, Handler: r}
go srv.ListenAndServe()
&lt;-ctx.Done()
srv.Shutdown(context.WithTimeout(...))</pre>
          <ul class="small">
            <li>Stops accepting; drains in-flight requests.</li>
            <li>Enough of a sketch — polish later with Postgres.</li>
          </ul>
        `,
        notes: "Live if time; else walk starter main."
      },
      {
        html: `
          <div class="kicker">Lab</div>
          <h2>Race detector: red → mutex → green</h2>
          <pre>cd starter/race-lab
go test -race ./counter/     # FAIL: data race
# fix with Mutex
go test -race ./...          # PASS</pre>
          <ul class="small">
            <li>Needs <code>CGO_ENABLED=1</code> and a C compiler (<code>build-essential</code> on Ubuntu).</li>
          </ul>
        `,
        notes: "Core lab. Don’t skip."
      },
      {
        cls: "demo",
        html: `
          <div class="tag">Live demo</div>
          <div class="kicker">-race</div>
          <h2>Show the FAIL, then the fix</h2>
          <pre>go test -race ./counter/
# DATA RACE
# after SafeAdd with Mutex:
go test -race ./counter/   # ok</pre>
        `,
        notes: "Projector must show the race report once."
      },
      {
        cls: "demo",
        html: `
          <div class="tag">Live demo</div>
          <div class="kicker">Context timeout</div>
          <h2>Demo endpoint respects deadline</h2>
          <pre>GET /api/demo/slow?ms=3000
# with 1s server timeout → 504 / canceled</pre>
        `,
        notes: "curl twice: under and over timeout."
      },
      {
        cls: "demo",
        html: `
          <div class="tag">Live demo</div>
          <div class="kicker">Shutdown</div>
          <h2>Ctrl+C drains, then exits</h2>
          <pre>go run ./cmd/server
# Ctrl+C → "shutting down" → clean exit</pre>
        `,
        notes: "Optional if lab needs time."
      },
      {
        html: `
          <div class="kicker">Pitfalls</div>
          <h2>Common week-12 bugs</h2>
          <ul class="small">
            <li>WaitGroup without mutex → still races.</li>
            <li>Forget <code>Unlock</code> / unlock wrong mutex → deadlock.</li>
            <li>Create context without <code>defer cancel()</code>.</li>
            <li>Ignore <code>ctx.Done()</code> in long loops.</li>
            <li><code>-race</code> fails: no gcc / CGO disabled.</li>
          </ul>
        `,
        notes: "Quiz aloud."
      },
      {
        html: `
          <div class="kicker">Lab · rest of class</div>
          <h2>Done when all of this is true</h2>
          <ul class="small">
            <li><code>go test -race ./...</code> green on race-lab</li>
            <li>Can explain Mutex vs WaitGroup vs channel</li>
            <li>Repo methods take <code>context.Context</code>; handlers pass request context</li>
            <li>Timeout demo works (or sketched)</li>
            <li>Optional: graceful shutdown in <code>main</code></li>
          </ul>
        `,
        notes: "Gate on board."
      },
      {
        html: `
          <div class="kicker">Homework</div>
          <h2>PR with <code>-race</code> in the README</h2>
          <ul class="small">
            <li>Test command documents <code>go test -race ./...</code>.</li>
            <li>Mutex on shared maps; context on repo signatures.</li>
            <li>PR notes: what was red, what made it green.</li>
          </ul>
        `,
        notes: "Screenshot of -race pass optional."
      },
      {
        html: `
          <div class="kicker">Next session</div>
          <h2>Week 13 — testing and code quality</h2>
          <ul class="small">
            <li>Table-driven tests, httptest, fakes.</li>
            <li>CI: gofmt, vet, test.</li>
            <li>Bring a green <code>-race</code> habit.</li>
          </ul>
        `,
        notes: "Teaser."
      },
      {
        html: `
          <div class="kicker">Words to keep</div>
          <h2>Say these correctly next week</h2>
          <div class="grid">
            <div class="card"><h3>Mutex</h3><p>Exclusive access to shared memory.</p></div>
            <div class="card"><h3>WaitGroup</h3><p>Join N goroutines; not a lock.</p></div>
            <div class="card"><h3>context</h3><p>Cancel / deadline flowing down the stack.</p></div>
            <div class="card"><h3>-race</h3><p>Detector for concurrent unsynchronized access.</p></div>
          </div>
        `,
        notes: "Oral quiz."
      },
      {
        html: `
          <div class="kicker">Layout reminder</div>
          <h2>Where lab code lives</h2>
          <pre>docs/week-12-day-01/starter/
  race-lab/                 # red → mutex → green
  backend/
    internal/repository/    # Mutex + context.Context params
    cmd/server/main.go      # graceful shutdown sketch
    internal/handlers/      # c.Request.Context() + timeout demo</pre>
        `,
        notes: "Race lab first."
      },
      {
        html: `
          <div class="kicker">Honest limits</div>
          <h2>What this week is not</h2>
          <ul class="small">
            <li>Not Postgres / real query cancel (week 14).</li>
            <li>Not deep testing / CI (week 13).</li>
            <li>Not “channels instead of every mutex.”</li>
            <li>Not production-hardening every edge case.</li>
          </ul>
        `,
        notes: "Keep spiral honest."
      },
      {
        html: `
          <div class="kicker">Safety</div>
          <h2>Still true</h2>
          <ul class="small">
            <li>Cap demo timeouts; don’t sleep forever in handlers.</li>
            <li>No secrets in fixtures.</li>
            <li><code>gofmt</code>; no binaries in git.</li>
          </ul>
        `,
        notes: "Quick."
      },
      {
        html: `
          <div class="kicker">Review bar</div>
          <h2>Instructor merges when</h2>
          <ul class="small">
            <li><code>go test -race ./...</code> documented and green (or lab evidence)</li>
            <li>Shared maps locked</li>
            <li>Repo signatures take context; handlers pass request context</li>
            <li>Create/list/import still behave</li>
          </ul>
        `,
        notes: "Collect PRs."
      },
      {
        titleSlide: true,
        cls: "center",
        html: `
          <h1>Questions</h1>
        `,
        notes: "Then race lab: red → green."
      }
    ];


    const root = document.getElementById("slides");
    const notesEl = document.getElementById("notes");
    const help = document.getElementById("help");
    let i = 0;
    let notesOn = false;

    slides.forEach((s, idx) => {
      const el = document.createElement("section");
      el.className = "slide" + (s.titleSlide ? " title-slide" : "") + (s.cls ? " " + s.cls : "");
      el.innerHTML = `
        <header class="brand-header">
          <img src="../branding/epic-learn-logo.png" alt="Epic Learn Education">
          <div class="session">Week 12 · Day 1</div>
        </header>
        ` + s.html + `
        <div class="foot">
          <span class="org">Epic Learn Institute of Higher Education - Go Programming Master Course</span>
          <span>${idx + 1} / ${slides.length}</span>
        </div>
        <div class="bar"><span></span></div>`;
      root.appendChild(el);
    });

    function show(n) {
      i = Math.max(0, Math.min(slides.length - 1, n));
      [...root.children].forEach((el, idx) => {
        el.classList.toggle("on", idx === i);
        el.querySelector(".bar > span").style.width = ((i + 1) / slides.length * 100) + "%";
      });
      notesEl.textContent = "Note: " + slides[i].notes;
      location.hash = String(i + 1);
    }

    function parseHash() {
      const n = parseInt(location.hash.replace("#", ""), 10);
      show(Number.isFinite(n) ? n - 1 : 0);
    }

    document.addEventListener("keydown", (e) => {
      if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) { e.preventDefault(); show(i + 1); }
      if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].includes(e.key)) { e.preventDefault(); show(i - 1); }
      if (e.key === "Home") show(0);
      if (e.key === "End") show(slides.length - 1);
      if (e.key === "n" || e.key === "N") { notesOn = !notesOn; notesEl.classList.toggle("on", notesOn); }
      if (e.key === "?" || e.key === "h") help.classList.toggle("on");
      if (e.key === "f" || e.key === "F") {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
      if (e.key === "p" || e.key === "P") window.print();
    });

    document.getElementById("slides").addEventListener("click", (e) => {
      if (e.clientX > innerWidth * 0.6) show(i + 1);
      else if (e.clientX < innerWidth * 0.4) show(i - 1);
    });

    window.addEventListener("hashchange", parseHash);
    parseHash();
  </script>
</body>
</html>
